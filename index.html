<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="robots" content="noindex,nofollow"/><meta name="description" content="Запчасти на карьерные самосвалы LGMG, SANY, TONLY"/><title>Запчасти LGMG, SANY, TONLY</title><style>:root{--dark:#22272a;--red:#d51e29;--muted:#72777b;--line:#dfe2e3}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#262a2d;background:#fff}a{color:inherit;text-decoration:none}header{height:104px;display:flex;align-items:center;gap:27px;padding:0 max(4vw,36px);border-bottom:1px solid #eee}.logo{font-weight:900;font-size:30px;letter-spacing:-2px;color:var(--red)}.logo span{display:block;font-size:9px;letter-spacing:2px;color:#343a3d;text-transform:uppercase}nav{display:flex;gap:24px;text-transform:uppercase;font-size:11px;font-weight:bold;flex:1}.contacts{display:grid;gap:5px;font-weight:bold;font-size:12px}.cart-link{white-space:nowrap;text-transform:uppercase;font-size:11px;font-weight:bold}.cart-link b{display:inline-grid;place-items:center;width:21px;height:21px;color:white;background:var(--red);border-radius:50%}.hero{min-height:510px;padding:100px max(7vw,45px);color:#fff;background:linear-gradient(110deg,#202427 20%,#373e40 55%,#171b1d)}.hero>div{max-width:770px}.hero h1{font-size:54px;margin:10px 0 18px;text-transform:uppercase;line-height:1.04}.hero p:first-child,h2{font-weight:800;letter-spacing:.5px}.hero span{font-size:11px;color:#c5c9ca}.search{display:flex;margin:28px 0 8px;max-width:680px}.search input{border:0;padding:17px 20px;flex:1;font-size:12px;min-width:0}.search button,.button,button{background:var(--red);color:#fff;border:0;padding:16px 23px;font-weight:bold;cursor:pointer}.wrap{max-width:1280px;margin:auto;padding:80px 30px}h1{font-size:38px;text-transform:uppercase}h2{font-size:26px;margin:10px 0 34px}.categories{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.categories a{height:135px;padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:bold;text-transform:uppercase;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,#fafafa,#eceff0)}.categories i{font-style:normal;color:var(--red);font-size:11px;margin-bottom:auto}.center{text-align:center;margin:35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.product{border:1px solid var(--line);padding:20px;min-height:330px;display:flex;flex-direction:column}.part-icon{height:125px;background:linear-gradient(145deg,#f0f2f2,#c9ced0);display:grid;place-items:center;margin-bottom:16px}.part-icon span{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;background:#5b6468;color:white;font-size:30px;font-weight:bold}.product h3{font-size:15px;text-transform:uppercase;min-height:36px}.product dl,.product-page dl{display:grid;grid-template-columns:110px 1fr;gap:6px;font-size:12px}.product dt,.product-page dt{color:#8b9093}.product dd,.product-page dd{margin:0;font-weight:bold}.more{margin-top:auto;color:var(--red);font-weight:bold;text-transform:uppercase;font-size:11px}.guarantees{background:#242a2d;color:#fff;padding:75px max(7vw,45px);display:grid;grid-template-columns:1fr 1fr;gap:75px}.guarantees p{border-left:3px solid var(--red);padding-left:17px;font-weight:bold}.guarantees li{padding:12px 0;border-bottom:1px solid #4b5255;font-weight:bold}.callback{background:#eef0f0;display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:65px max(7vw,45px)}form label{display:block;font-size:11px;margin:12px 0}.result{color:#087a36;font-weight:bold;display:block}footer{background:#1d2224;color:#fff;padding:65px max(7vw,45px) 28px;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:30px}footer b,footer a{display:block;margin-bottom:11px}footer b{color:#abb2b4;font-size:11px}footer a{font-size:12px}.page{min-height:560px}.crumb{color:#8c9295;font-size:12px}.light{border:1px solid var(--line);margin:20px 0 40px}.light input{background:#fff}.catalog-layout{display:grid;grid-template-columns:230px 1fr;gap:30px}.catalog-layout aside a{display:block;padding:11px 0;border-bottom:1px solid var(--line);font-weight:bold}.product-page{display:grid;grid-template-columns:45% 1fr;gap:55px}.product-page>.part-icon{height:400px}.ask{font-size:20px;font-weight:bold}.qty{display:flex;align-items:center;gap:10px}.qty button{padding:10px 15px}.cart-line{display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding:15px}.cart-line .part-icon{width:90px;height:65px;margin:0}.cart-line .part-icon span{width:45px;height:45px;font-size:18px}.info>p{font-size:17px;line-height:1.7;max-width:750px}@media(max-width:980px){header{height:auto;padding:20px 25px;flex-wrap:wrap}nav{order:3;width:100%;overflow:auto}.hero h1{font-size:39px}.categories{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.catalog-layout{grid-template-columns:1fr}.catalog-layout aside{display:flex;gap:15px;overflow:auto}.catalog-layout aside a{white-space:nowrap}.product-page{grid-template-columns:1fr}.product-page>.part-icon{height:260px}}@media(max-width:640px){header{gap:14px}.contacts{display:none}nav{gap:16px;font-size:10px}.hero{min-height:450px;padding:75px 25px}.hero h1{font-size:31px}.wrap{padding:52px 18px}h1{font-size:28px}h2{font-size:21px}.categories{grid-template-columns:repeat(2,1fr)}.categories a{height:110px;font-size:11px}.grid{grid-template-columns:1fr}.guarantees,.callback,footer{grid-template-columns:1fr;gap:28px;padding:45px 25px}.callback .search{flex-direction:column}.cart-line{flex-wrap:wrap}}
</style></head><body><div id="app"></div><script>const categories=['Двигатель','Сцепление','Трансмиссия','Мосты','Карданный вал','Подвеска','Рулевое управление','Рама в сборе','Тормозная система','Гидравлическая подъемная система','Кабина','Электрическая система','Кондиционирование'];
const products=[
 {id:'most-v-sbore-4110001167',name:'Мост в сборе 4110001167',manufacturer:'LGMG',article:'4110001167',category:'Мосты',desc:'Оригинальный мост в сборе для карьерных самосвалов LGMG.',spec:{'Артикул':'4110001167','Производитель':'LGMG','Состояние':'новое'}},
 {id:'podshipnik-33218',name:'Подшипник конический ступицы внутренний 33218 4110001182015',manufacturer:'HanDe',article:'4110001182015',oem:'33218',category:'Мосты',desc:'Конический подшипник ступицы.',spec:{'Артикул':'4110001182015','OEM':'33218','Производитель':'HanDe'}},
 {id:'shhit-tormoza',name:'Щит тормоза DZ90149346030 4110001187116',manufacturer:'HanDe',article:'4110001187116',oem:'DZ90149346030',category:'Тормозная система',desc:'Щит тормозной системы.',spec:{'Артикул':'4110001187116','OEM':'DZ90149346030','Производитель':'HanDe'}},
 {id:'salnik-zadnij',name:'Сальник задний 61500010100 4110000001006',manufacturer:'Weichai',article:'4110000001006',oem:'61500010100',category:'Двигатель',desc:'Задний сальник двигателя.',spec:{'Артикул':'4110000001006','OEM':'61500010100','Производитель':'Weichai'}},
 {id:'klapan-vypusknoj',name:'Клапан выпускной 612600050025 4110000001249',manufacturer:'Weichai',article:'4110000001249',oem:'612600050025',category:'Двигатель',desc:'Выпускной клапан Weichai.',spec:{'Артикул':'4110000001249','OEM':'612600050025','Производитель':'Weichai'}},
 {id:'disk-kolesnyj',name:'Диск колесный 10.00/2.0-25 4110000757',manufacturer:'LGMG',article:'4110000757 / 4110706919',category:'Подвеска',desc:'Колёсный диск для самосвала.',spec:{'Артикул':'4110000757 / 4110706919','Производитель':'LGMG'}}];
let cart=JSON.parse(localStorage.getItem('sdk-cart')||'{}'); let route=location.hash.slice(1)||'/';
const link=(path,label,cls='')=>`<a class="${cls}" href="#${path}">${label}</a>`; const icon=p=>`<div class="part-icon"><span>${p.category.slice(0,1)}</span></div>`;
function header(){return `<header><a class="logo" href="#/">СДК<span>запчасти</span></a><nav>${link('/shop','Каталог')}${link('/delivery','Оплата и доставка')}${link('/about','О нас')}${link('/press','Пресс-центр')}${link('/contact','Контакты')}</nav><div class="contacts"><a href="tel:+79770895224">8 977 089 52 24</a><a href="mailto:sale@snab-dc.ru">sale@snab-dc.ru</a></div>${link('/cart',`Корзина <b>${count()}</b>`,'cart-link')}</header>}
function count(){return Object.values(cart).reduce((a,b)=>a+b,0)} function card(p){return `<article class="product">${icon(p)}<h3>${p.name}</h3><dl><dt>Производитель</dt><dd>${p.manufacturer}</dd><dt>Артикул</dt><dd>${p.article}</dd>${p.oem?`<dt>OEM-номер</dt><dd>${p.oem}</dd>`:''}</dl>${link('/product/'+p.id,'Подробнее','more')}</article>`}
function form(){return `<section class="callback"><div><h2>НЕ НАШЛИ ОТВЕТ НА СВОЙ ВОПРОС?</h2><p>Оставьте номер телефона, мы перезвоним в течении 15 минут и проконсультируем Вас</p></div><form onsubmit="return submitForm(event)"><input required placeholder="Ваше имя"/><input required placeholder="Номер телефона*"/><label><input required type="checkbox"/> Согласен на обработку персональных данных</label><button>ОТПРАВИТЬ</button><small class="result"></small></form></section>`}
function footer(){return `<footer><div><b>МЕНЮ</b>${link('/delivery','Оплата и доставка')}${link('/about','О нас')}${link('/press','Пресс-центр')}${link('/contact','Контакты')}</div><div><b>КАТАЛОГ</b>${categories.map(x=>link('/shop?category='+encodeURIComponent(x),x)).join('')}</div><div><b>КОНТАКТЫ</b><a href="mailto:sale@snab-dc.ru">sale@snab-dc.ru</a><a href="tel:+79770895224">8 977 089 52 24</a><p>ООО «СДК»<br>ОГРН 5147746154397<br>ИНН 7723921503</p>${link('/privacy','Политика конфиденциальности')}</div><small>© 2025. Компания ООО «Снабжение Добывающих Компаний»</small></footer>`}
function home(){return `<main><section class="hero"><div><p>ПРОДАЖА ЗАПЧАСТЕЙ LGMG, SANY, TONLY</p><h1>Запчасти для карьерной техники</h1><p>Осуществляем поставку запасных частей к карьерным самосвалам LGMG, SANY, TONLY. Работаем по всей России.</p><form class="search" onsubmit="return search(event)"><input placeholder="БЫСТРЫЙ ПОИСК ЗАПЧАСТЕЙ"/><button>НАЙТИ</button></form><span>Например: 1J0 413 031 AG</span></div></section><section class="wrap"><h2>КАТАЛОГ ЗАПЧАСТЕЙ МАРКИ LGMG</h2><div class="categories">${categories.map((c,i)=>link('/shop?category='+encodeURIComponent(c),`<i>${String(i+1).padStart(2,'0')}</i>${c}`)).join('')}</div><p class="center">${link('/shop','ПЕРЕЙТИ В КАТАЛОГ','button')}</p><h2>ВЫГОДНОЕ ПРЕДЛОЖЕНИЕ</h2><div class="grid">${products.map(card).join('')}</div></section><section class="guarantees"><div><h2>МЫ ГАРАНТИРУЕМ</h2><p>ГАРАНТИРУЕМ ЧЁТКУЮ, БЫСТРУЮ ОБРАБОТКУ И ОТПРАВКУ ЗАКАЗОВ</p><p>ПОСТОЯННОЕ НАЛИЧИЕ ЗАПАСНЫХ ЧАСТЕЙ НА НАШИХ СКЛАДАХ</p></div><div><h2>КОМПЛЕКСНЫЙ ПОДХОД</h2><ol><li>КОМПЕТЕНТНОСТЬ</li><li>СКЛАД</li><li>ГАРАНТИЯ</li><li>ОПЕРАТИВНОСТЬ</li></ol></div></section>${form()}</main>`}
function shop(){let query=new URLSearchParams(route.split('?')[1]||'');let cat=query.get('category'),q=query.get('q')||'';let list=products.filter(p=>!cat||p.category===cat).filter(p=>JSON.stringify(p).toLowerCase().includes(q.toLowerCase()));return `<main class="wrap page"><p class="crumb">Главная / Каталог</p><h1>${cat||'КАТАЛОГ'}</h1><form class="search light" onsubmit="return search(event)"><input value="${q}" placeholder="Поиск по названию, артикулу, OEM"/><button>НАЙТИ</button></form><div class="catalog-layout"><aside>${categories.map(x=>link('/shop?category='+encodeURIComponent(x),x)).join('')}</aside><div class="grid">${list.length?list.map(card).join(''):'<p>Ничего не найдено.</p>'}</div></div></main>`}
function product(id){let p=products.find(x=>x.id===id);if(!p)return shop();return `<main class="wrap page"><p class="crumb">Главная / Каталог / ${p.category}</p><div class="product-page">${icon(p)}<div><h1>${p.name}</h1><p>${p.desc}</p><dl>${Object.entries(p.spec).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><p class="ask">Цена по запросу у менеджера</p><div class="qty"><button onclick="changeQty(-1)">−</button><span id="qty">1</span><button onclick="changeQty(1)">+</button><button class="button" onclick="add('${p.id}')">В КОРЗИНУ</button></div></div></div></main>`}
function info(title,content){return `<main class="wrap page info"><p class="crumb">Главная / ${title}</p><h1>${title}</h1>${content}${form()}</main>`} function cartPage(){let lines=Object.entries(cart).map(([id,n])=>{let p=products.find(x=>x.id===id);return p&&`<div class="cart-line">${icon(p)}<b>${p.name}</b><span>${n} шт.</span><button onclick="add('${id}',-1)">Удалить</button></div>`}).join('');return `<main class="wrap page"><h1>КОРЗИНА</h1>${lines||'<p>Ваша корзина пуста.</p>'}<p class="ask">Цена по запросу</p></main>`}
function render(){let body=route.startsWith('/product/')?product(route.split('/').pop()):route.startsWith('/shop')?shop():route==='/cart'?cartPage():route==='/about'?info('О НАС','<p>Компания поставляет запчасти для карьерной техники по всей России.</p><h2>МЫ ГАРАНТИРУЕМ</h2><p>Комплексный подход, надёжные поставки и опыт специалистов.</p>'):route==='/delivery'?info('ОПЛАТА И ДОСТАВКА','<h2>Способы оплаты</h2><p>Условия согласовываются с менеджером.</p><h2>Способы доставки</h2><p>Доставка по России транспортными компаниями.</p>'):route==='/contact'?info('КОНТАКТЫ','<p>sale@snab-dc.ru<br>8 977 089 52 24</p>'):route==='/press'?info('ПРЕСС-ЦЕНТР','<p>Новости и материалы компании.</p>'):route==='/privacy'?info('ПОЛИТИКА КОНФИДЕНЦИАЛЬНОСТИ','<p>Локальная демонстрационная версия не передаёт введённые данные третьим лицам.</p>'):home();document.querySelector('#app').innerHTML=header()+body+footer()} function add(id,n=1){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];localStorage.setItem('sdk-cart',JSON.stringify(cart));render()} function changeQty(n){let el=document.querySelector('#qty');el.textContent=Math.max(1,+el.textContent+n)} function search(e){e.preventDefault();let q=e.target.querySelector('input').value;location.hash='/shop?q='+encodeURIComponent(q);return false} function submitForm(e){e.preventDefault();e.target.querySelector('.result').textContent='Заявка успешно отправлена. Скоро мы свяжемся с Вами.';e.target.reset();return false} addEventListener('hashchange',()=>{route=location.hash.slice(1)||'/';render()});render();
</script></body></html>
